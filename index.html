var bgVoice=null;var speechReady=false;
try{
  if(typeof speechSynthesis!=="undefined"){
    var findVoices=function(){try{var vs=speechSynthesis.getVoices();bgVoice=vs.find(function(v){return v.lang.indexOf("bg")===0;})||null;speechReady=vs.length>0;}catch(e){}};
    findVoices();
    if(speechSynthesis.onvoiceschanged!==undefined){speechSynthesis.onvoiceschanged=findVoices;}
  }
}catch(e){}

function speak(text,e){
  try{
    if(e&&e.stopPropagation){e.stopPropagation();e.preventDefault();}
    if(typeof speechSynthesis==="undefined")return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="bg-BG";u.rate=0.85;u.pitch=1;
    if(bgVoice)u.voice=bgVoice;
    speechSynthesis.speak(u);
  }catch(err){}
}

function SpeakBtn(props){
  var text=props.text;var size=props.size;

  var btnStyle=sz==="sm"?{fontSize:14,padding:"2px 6px"}:sz==="lg"?{fontSize:22,padding:"6px 10px"}:{fontSize:17,padding:"4px 8px"};
  btnStyle.background="none";btnStyle.border="1px solid #e2e8f0";btnStyle.borderRadius=8;btnStyle.cursor="pointer";btnStyle.transition="all .15s";btnStyle.lineHeight=1;
  return ce("button",{onClick:function(e){speak(text,e);},title:"Luister",style:btnStyle},"\uD83D\uDD0A");
}

        ce("div",{style:{width:48,height:1,background:"#99f6e4",margin:"0 auto 10px"}}),
        ce("div",{style:{fontSize:20,fontWeight:600,color:"#334155"}},"\u{1f1f3}\u{1f1f1} "+w.n),
        ce("div",{style:{fontSize:16,color:"#64748b",marginTop:4}},"\u{1f1ec}\u{1f1e7} "+w.e),
        ld&&ce("div",{style:{color:"#059669",fontSize:13,marginTop:8}},"\u2713 Geleerd!"))),
    ce("div",{className:"nr"},
      ce("button",{className:"btn "+(idx===0?"btn-off":"btn-g"),disabled:idx===0,onClick:()=>{sI(idx-1);sF(false);}},"\u2190 Vorige"),
      idx===ws.length-1?
        ce("button",{className:"btn btn-t",onClick:()=>{mk();go("home");}},"\u2713 Klaar!"):
        ce("button",{className:"btn btn-t",onClick:()=>{mk();sI(idx+1);sF(false);}},"Volgende \u2192")));
}

// === GRAMMAR ===
function Gram({gram,st,sS}){
  const g=gram;
  const done=()=>{sS(s=>({...s,gl:(s.gl||0)+1,xp:s.xp+20}));};
  uE(()=>{done();},[]);
  const hdr=g.rows[0]&&g.rows[0].length>2;
  return ce("div",{className:"gram-box sy2"},
    ce("div",{className:"h3"},"\u{1f4d0} "+g.title),
    ce("p",{style:{fontSize:13,color:"#334155"}},g.intro),
    ce("table",{className:"gram-tbl"},
      ce("tbody",null,g.rows.map((r,i)=>
        ce("tr",{key:i},r.map((c,j)=>{
          const isBg=j>0&&j<(hdr?r.length-1:r.length)&&i>0&&/[\u0400-\u04FF]/.test(c);
          const txt=isBg?c.replace(/\s*\(.*?\)\s*/g,""):c;
          return ce(i===0&&hdr?"th":"td",{key:j},
            isBg?ce("span",{style:{display:"flex",alignItems:"center",gap:4}},c,ce(SpeakBtn,{text:txt,size:"sm"})):c);}))))),
    g.tip&&ce("div",{className:"gram-tip"},g.tip));
}

// === CONVERSATION ===
function Conv({lines,st,sS}){
  const[show,sShow]=uS(1);
  uE(()=>{sS(s=>({...s,cl:(s.cl||0)+1}));},[]);
  return ce("div",{className:"sy2"},
    ce("div",{className:"h3",style:{marginBottom:8}},"\u{1f4ac} Gesprek"),
    ce("p",{style:{fontSize:12,color:"#64748b",marginBottom:12}},"Tik op 'Volgende' om het gesprek regel voor regel te zien."),
    lines.slice(0,show).map((l,i)=>
      ce("div",{key:i,className:"conv-line conv-"+(l.side||"l")},
        ce("div",{className:"conv-speaker"},l.s+":"),
        ce("div",{className:"conv-text"},
          ce("div",{style:{display:"flex",alignItems:"center",gap:6}},
            ce("div",{className:"conv-bg"},l.b),
            ce(SpeakBtn,{text:l.b,size:"sm"})),
          ce("div",{className:"conv-nl"},l.n)))),
    show<lines.length&&ce("button",{className:"btn btn-t",style:{marginTop:8},onClick:()=>sShow(show+1)},"\u{1f4ac} Volgende regel"),
    show>=lines.length&&ce("div",{style:{color:"#059669",fontSize:13,fontWeight:500,marginTop:8}},"\u2713 Gesprek compleet!"));
}

// === MODULE ROUTER ===
function ModScreen({mod,go,st,sS}){
  const[tab,sTab]=uS("learn");
  if(mod.type==="alpha")return ce(AlphaList,{go,st});

  const hasg=!!mod.gram;const hasw=!!mod.ws&&mod.ws.length>0;const hasc=!!mod.conv;
  const tabs=[];
  if(hasw)tabs.push(["learn","Woorden"]);
  if(hasg)tabs.push(["gram","Grammatica"]);
  if(hasc)tabs.push(["conv","Gesprek"]);

  return ce("div",{className:"scr sy"},
    ce("div",{className:"nr"},
      ce("button",{className:"btn btn-g",onClick:()=>go("home")},"\u2190 Home"),
      ce("span",{style:{fontSize:13,color:"#64748b"}},"Week "+mod.wk)),
    ce("div",{className:"ctr"},
      ce("div",{style:{fontSize:36}},mod.em),
      ce("h2",{className:"h2",style:{marginTop:4}},mod.t),
      ce("p",{className:"sub"},mod.desc)),
    tabs.length>1&&ce("div",{className:"tab-row"},
      tabs.map(([k,l])=>ce("button",{key:k,className:"tab"+(tab===k?" tab-on":""),onClick:()=>sTab(k)},l))),
    tab==="learn"&&hasw&&ce(Vocab,{mod,go,st,sS}),
    tab==="gram"&&hasg&&ce(Gram,{gram:mod.gram,st,sS}),
    tab==="conv"&&hasc&&ce(Conv,{lines:mod.conv,st,sS}),
    !hasw&&!hasg&&hasc&&tab==="learn"&&ce(Conv,{lines:mod.conv,st,sS}));
}

// === QUIZ ===
function Quiz({go,st,sS}){
  const aw=allWords(MODS);
  const al=ALPHA.flatMap(g=>g.ls);
  const[qi,sQI]=uS(0);const[sc,sSC]=uS(0);const[sk,sSK]=uS(0);
  const[sel,sSEL]=uS(null);const[sh2,sSH]=uS(false);
  const[qs,sQS]=uS([]);const[dn,sDN]=uS(false);

  const gen=()=>{
    const q=[];
    const sw=sh(aw);
    for(let i=0;i<Math.min(8,sw.length);i++){
      const c=sw[i];const wr=sh(aw.filter(w=>w.n!==c.n)).slice(0,3);
      q.push({pr:c.b,hi:"["+c.p+"]",ans:c.n,ops:sh([c.n,...wr.map(w=>w.n)]),em:c.m});}
    const sl=sh(al);
    for(let i=0;i<Math.min(7,sl.length);i++){
      const c=sl[i];const wr=sh(al.filter(l=>l.du!==c.du)).slice(0,3);
      q.push({pr:c.u+" "+c.l,hi:"Welke klank?",ans:c.du,ops:sh([c.du,...wr.map(l=>l.du)]),em:"\u{1f524}"});}
    sQS(sh(q));sQI(0);sSC(0);sSK(0);sSEL(null);sSH(false);sDN(false);};
  uE(()=>{gen();},[]);

  if(qs.length===0)return null;
  const q=qs[qi];const ok=sel===q.ans;
  const pick=(o)=>{if(sh2)return;sSEL(o);sSH(true);const g=o===q.ans;const ns=g?sk+1:0;sSK(ns);if(g)sSC(sc+1);
    sS(s=>({...s,xp:s.xp+(g?15:0),qo:(s.qo||0)+(g?1:0),qb:Math.max(s.qb||0,ns)}));};
  const nx=()=>{if(qi>=qs.length-1)sDN(true);else{sQI(qi+1);sSEL(null);sSH(false);}};

  if(dn){const pc=Math.round(sc/qs.length*100);
    return ce("div",{className:"scr sy ctr"},
      ce("div",{style:{fontSize:56}},pc>=80?"\u{1f389}":pc>=50?"\u{1f44f}":"\u{1f4aa}"),
      ce("h2",{className:"h1"},pc>=80?"Geweldig!":pc>=50?"Goed gedaan!":"Blijf oefenen!"),
      ce("div",{className:"gradient-text",style:{fontSize:44,fontWeight:800}},sc+"/"+qs.length),
      ce("p",{style:{color:"#64748b"}},pc>=80?"Je bent echt goed bezig!":pc>=50?"Goede basis!":"Oefening baart kunst!"),
      ce("div",{style:{display:"flex",gap:12,justifyContent:"center"}},
        ce("button",{className:"btn btn-v",onClick:gen},"\u{1f504} Opnieuw"),
        ce("button",{className:"btn btn-g",onClick:()=>go("home"),style:{background:"#f1f5f9"}},"Home")));}

  return ce("div",{className:"scr sy"},
    ce("div",{className:"nr"},
      ce("span",{style:{fontSize:13,color:"#64748b"}},"Vraag "+(qi+1)+"/"+qs.length),
      ce("div",{style:{display:"flex",alignItems:"center",gap:8}},
        ce("span",{style:{fontSize:13,fontWeight:500,color:"#059669"}},sc+" goed"),
        sk>1&&ce("span",{className:"streak"},"\u{1f525} "+sk+"x"))),
    ce("div",{className:"pb"},ce("div",{style:{height:"100%",borderRadius:999,background:"linear-gradient(to right,#a78bfa,#9333ea)",width:((qi+1)/qs.length*100)+"%",transition:"width .3s"}})),
    ce("div",{style:{background:"linear-gradient(135deg,#f5f3ff,#faf5ff)",borderRadius:16,padding:20,textAlign:"center",border:"1px solid #ede9fe"}},
      ce("div",{style:{fontSize:26,marginBottom:6}},q.em),
      ce("div",{style:{fontSize:32,fontWeight:700,color:"#6d28d9",marginBottom:4}},q.pr),
      ce("div",{style:{fontSize:13,color:"#a78bfa"}},q.hi)),
    ce("div",{className:"sy3"},q.ops.map((o,i)=>{
      let cl="qo";if(sh2){if(o===q.ans)cl+=" qo-ok";else if(o===sel&&!ok)cl+=" qo-no";else cl+=" qo-x";}
      return ce("button",{key:i,className:cl,disabled:sh2,onClick:()=>pick(o)},
        ce("span",null,o),sh2&&o===q.ans&&ce("span",null,"\u2713"),sh2&&o===sel&&!ok&&o!==q.ans&&ce("span",null,"\u2717"));})),
    sh2&&ce("div",{className:"ctr"},
      ce("div",{style:{fontSize:13,fontWeight:500,color:ok?"#059669":"#dc2626",marginBottom:10}},ok?"\u2728 Goed zo!":"Het antwoord was: "+q.ans),
      ce("button",{className:"btn btn-v",onClick:nx},qi>=qs.length-1?"Resultaat":"Volgende")));
}

// === BADGES ===
function BadgScr({st}){
  return ce("div",{className:"scr sy"},
    ce("div",{className:"ctr"},ce("h2",{className:"h1"},"Jouw Badges"),ce("p",{className:"sub"},"Blijf leren om ze allemaal te verdienen!")),
    ce("div",{className:"bg2"},BADGES.map(b=>{
      const ea=b.rq(st);
      return ce("div",{key:b.id,className:"badge "+(ea?"badge-y":"badge-n")},
        ce("div",{style:{fontSize:26,marginBottom:6,filter:ea?"none":"grayscale(1)",opacity:ea?1:.4}},b.ic),
        ce("div",{style:{fontSize:12,fontWeight:600,color:ea?"#1e293b":"#94a3b8"}},b.nm),
        ce("div",{style:{fontSize:10,color:"#64748b",marginTop:3}},b.ds),
        ea?ce("div",{style:{fontSize:10,color:"#d97706",fontWeight:500,marginTop:6}},"Verdiend! \u2728"):
          ce("div",{style:{fontSize:14,color:"#cbd5e1",marginTop:6}},"\u{1f512}"));})));
}

// === APP ===
function App(){
  const[scr,sScr]=uS("home");
  const[st,sS]=uS({xp:0,sk:1,ll:0,wl:0,li:[],wi:[],gd:[],qo:0,qb:0,gl:0,cl:0,mc:0});
  const go=(s)=>sScr(s);

  // Find module
  const modId=scr.startsWith("mod:")?scr.slice(4):null;
  const mod=modId?MODS.find(m=>m.id===modId):null;
  const agIdx=scr.startsWith("ag:")?parseInt(scr.slice(3)):null;

  return ce("div",{className:"app"},
    ce(Nav,{scr,go,st}),
    scr==="home"&&ce(Home,{go,st}),
    mod&&mod.type==="alpha"&&ce(AlphaList,{go,st}),
    mod&&mod.type!=="alpha"&&ce(ModScreen,{mod,go,st,sS}),
    agIdx!==null&&ce(AlphaGrp,{gi:agIdx,go,st,sS}),
    scr==="quiz"&&ce(Quiz,{go,st,sS}),
    scr==="badges"&&ce(BadgScr,{st}));
}

try{
  var root=document.getElementById("root");
  if(ReactDOM.createRoot){ReactDOM.createRoot(root).render(ce(App));}
  else{ReactDOM.render(ce(App),root);}
}catch(err){
  document.getElementById("root").innerHTML="<div style='padding:20px;font-family:sans-serif'><h2>Er ging iets mis</h2><p>"+err.message+"</p></div>";
}
</script>
</body>
