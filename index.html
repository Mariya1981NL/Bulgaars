<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Български за деца — Volledig Programma</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;color:#1e293b;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit;border:none;background:none}
.app{min-height:100vh;max-width:520px;margin:0 auto;background:#f8fafc}
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:30}
.nav-left{display:flex;align-items:center;gap:8px}
.nav-title{font-size:18px;font-weight:700;background:linear-gradient(to right,#0d9488,#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-sub{font-size:11px;color:#94a3b8;margin-top:2px}
.nav-right{display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;font-size:13px;font-weight:600}
.pill-xp{background:#fffbeb;color:#b45309}
.pill-str{background:#fef2f2;color:#dc2626}
.back-btn{padding:8px;border-radius:8px;font-size:20px;color:#64748b;transition:background .2s}
.back-btn:hover{background:#f1f5f9}
.scr{padding:24px 16px;max-width:520px;margin:0 auto}
.ctr{text-align:center}
.sy>*+*{margin-top:16px}.sy2>*+*{margin-top:12px}.sy3>*+*{margin-top:8px}
.h1{font-size:22px;font-weight:700;color:#1e293b}
.h2{font-size:18px;font-weight:700;color:#1e293b}
.h3{font-size:15px;font-weight:600;color:#1e293b}
.sub{font-size:13px;color:#64748b}
.card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;padding:16px;transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card-r{display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.card-i{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
.card-b{flex:1;min-width:0}
.card-t{font-weight:600;font-size:14px;color:#1e293b}
.card-d{font-size:12px;color:#64748b;margin-top:2px}
.pb{height:6px;background:#f1f5f9;border-radius:999px;overflow:hidden}
.pf{height:100%;border-radius:999px;transition:width .5s}
.fc{border-radius:16px;border:2px solid;padding:28px 20px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:box-shadow .2s;user-select:none}
.fc:hover{box-shadow:0 8px 24px rgba(0,0,0,.1)}
.fc-big{font-size:64px;font-weight:800;line-height:1.1}
.fc-hint{font-size:13px;color:#94a3b8;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;border-radius:12px;font-size:14px;font-weight:500;transition:all .2s}
.btn-t{background:#14b8a6;color:#fff}.btn-t:hover{background:#0d9488}
.btn-v{background:#8b5cf6;color:#fff}.btn-v:hover{background:#7c3aed}
.btn-e{background:#10b981;color:#fff}.btn-e:hover{background:#059669}
.btn-g{color:#64748b}.btn-g:hover{background:#f1f5f9}
.btn-off{color:#cbd5e1;cursor:not-allowed}
.qo{width:100%;padding:14px;border-radius:12px;border:2px solid #e2e8f0;text-align:left;font-weight:500;font-size:14px;transition:all .15s;background:#fff;display:flex;align-items:center;justify-content:space-between}
.qo:hover:not(:disabled){border-color:#a78bfa;background:#f5f3ff}
.qo-ok{background:#ecfdf5!important;border-color:#34d399!important;color:#065f46!important}
.qo-no{background:#fef2f2!important;border-color:#f87171!important;color:#991b1b!important}
.qo-x{background:#f8fafc!important;border-color:#e2e8f0!important;color:#94a3b8!important}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;transition:all .2s;background:#e2e8f0}
.bg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{padding:14px;border-radius:16px;border:1px solid;text-align:center}
.badge-y{background:linear-gradient(135deg,#fffbeb,#fefce8);border-color:#fbbf24}
.badge-n{background:#f8fafc;border-color:#e2e8f0;opacity:.55}
.fp{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.fpill{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:500;transition:all .2s}
.fp-on{background:#14b8a6;color:#fff}
.fp-off{background:#f1f5f9;color:#64748b}.fp-off:hover{background:#e2e8f0}
.nr{display:flex;align-items:center;justify-content:space-between}
.fact{background:#f8fafc;border-radius:12px;padding:14px;border:1px solid #f1f5f9;display:flex;gap:8px;text-align:left}
.streak{padding:2px 8px;background:#fef3c7;color:#b45309;border-radius:999px;font-size:12px;font-weight:700}
.phase-h{padding:8px 14px;border-radius:12px;font-size:12px;font-weight:600;margin-bottom:4px;display:inline-block}
.ph1{background:#ecfdf5;color:#047857}
.ph2{background:#ede9fe;color:#6d28d9}
.lock-card{opacity:.5}
.lock-card .card{pointer-events:none}
.gram-box{background:#f0f9ff;border:1px solid #bae6fd;border-radius:16px;padding:16px}
.gram-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.gram-tbl th{background:#e0f2fe;padding:8px;text-align:left;font-weight:600;border-radius:4px}
.gram-tbl td{padding:8px;border-bottom:1px solid #e0f2fe}
.gram-tbl tr:last-child td{border-bottom:none}
.gram-tip{background:#fef3c7;border-radius:10px;padding:12px;font-size:13px;color:#92400e;margin-top:12px}
.conv-line{display:flex;gap:10px;padding:10px;border-radius:12px;margin-bottom:6px}
.conv-l{background:#f0fdf4;border:1px solid #bbf7d0}.conv-r{background:#f0f9ff;border:1px solid #bae6fd}
.conv-speaker{font-weight:700;font-size:13px;min-width:50px}
.conv-text{flex:1}
.conv-bg{font-size:15px;font-weight:600;color:#1e293b}
.conv-nl{font-size:12px;color:#64748b;margin-top:2px}
.grad-t{background:linear-gradient(135deg,#2dd4bf,#10b981)}
.grad-e{background:linear-gradient(135deg,#34d399,#22c55e)}
.grad-v{background:linear-gradient(135deg,#a78bfa,#9333ea)}
.grad-a{background:linear-gradient(135deg,#fbbf24,#f97316)}
.grad-s{background:linear-gradient(135deg,#38bdf8,#0ea5e9)}
.grad-p{background:linear-gradient(135deg,#f472b6,#ec4899)}
.grad-r{background:linear-gradient(135deg,#fb923c,#f97316)}
.grad-i{background:linear-gradient(135deg,#818cf8,#6366f1)}
.g-em .fc{border-color:#a7f3d0;background:#ecfdf5}.g-em .fc-big{color:#047857}.g-em .ex{background:#d1fae5}.g-em .pf,.g-em .dot-a,.g-em .dot-d{background:#10b981}.g-em .btn-c{background:#10b981;color:#fff}
.g-am .fc{border-color:#fde68a;background:#fffbeb}.g-am .fc-big{color:#b45309}.g-am .ex{background:#fef3c7}.g-am .pf,.g-am .dot-a,.g-am .dot-d{background:#f59e0b}.g-am .btn-c{background:#f59e0b;color:#fff}
.g-sk .fc{border-color:#bae6fd;background:#f0f9ff}.g-sk .fc-big{color:#0369a1}.g-sk .ex{background:#e0f2fe}.g-sk .pf,.g-sk .dot-a,.g-sk .dot-d{background:#0ea5e9}.g-sk .btn-c{background:#0ea5e9;color:#fff}
.g-vi .fc{border-color:#ddd6fe;background:#f5f3ff}.g-vi .fc-big{color:#6d28d9}.g-vi .ex{background:#ede9fe}.g-vi .pf,.g-vi .dot-a,.g-vi .dot-d{background:#8b5cf6}.g-vi .btn-c{background:#8b5cf6;color:#fff}
.gc-em{background:#ecfdf5;border-color:#a7f3d0}.gc-am{background:#fffbeb;border-color:#fde68a}.gc-sk{background:#f0f9ff;border-color:#bae6fd}.gc-vi{background:#f5f3ff;border-color:#ddd6fe}
.cc-em{color:#047857}.cc-am{color:#b45309}.cc-sk{color:#0369a1}.cc-vi{color:#6d28d9}
.trick{display:inline-block;padding:4px 12px;background:#fef3c7;color:#92400e;border-radius:999px;font-size:13px;font-weight:500}
.tab-row{display:flex;gap:4px;background:#f1f5f9;border-radius:12px;padding:3px;margin-bottom:12px}
.tab{flex:1;padding:8px;border-radius:10px;font-size:13px;font-weight:500;text-align:center;transition:all .2s;color:#64748b}
.tab-on{background:#fff;color:#1e293b;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* Memory Game */
.mem-grid{display:grid;gap:10px;perspective:600px}
.mem-grid-4{grid-template-columns:repeat(4,1fr)}
.mem-grid-3{grid-template-columns:repeat(3,1fr)}
.mem-card{aspect-ratio:3/4;cursor:pointer;perspective:600px}
.mem-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mem-card.flipped .mem-inner{transform:rotateY(180deg)}
.mem-card.matched .mem-inner{transform:rotateY(180deg)}
.mem-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center;border:2px solid #e2e8f0;overflow:hidden}
.mem-back{background:linear-gradient(135deg,#a78bfa,#8b5cf6);display:flex;align-items:center;justify-content:center}
.mem-back span{font-size:32px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.mem-front{background:#fff;transform:rotateY(180deg)}
.mem-front-bg{border-color:#14b8a6;background:#f0fdfa}
.mem-front-nl{border-color:#8b5cf6;background:#f5f3ff}
.mem-card.matched .mem-face{opacity:.7;border-color:#86efac;background:#ecfdf5}
.mem-card.matched .mem-front-bg{border-color:#86efac;background:#ecfdf5}
.mem-card.matched .mem-front-nl{border-color:#86efac;background:#ecfdf5}
.mem-card.wrong .mem-inner{animation:mem-shake .4s}
@keyframes mem-shake{0%,100%{transform:rotateY(180deg)}25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}
.mem-word{font-size:14px;font-weight:700;line-height:1.2;word-break:break-word}
.mem-hint{font-size:10px;color:#94a3b8;margin-top:2px}
.mem-em{font-size:18px;margin-bottom:2px}
.mem-stats{display:flex;justify-content:center;gap:16px;font-size:14px;font-weight:500;color:#64748b}
.mem-stat-val{font-weight:700;color:#1e293b}
.mem-complete{text-align:center;padding:20px}

/* Search / Woordenboek */
.search-box{position:relative}
.search-input{width:100%;padding:12px 16px 12px 40px;border-radius:12px;border:2px solid #e2e8f0;font-size:14px;font-family:inherit;background:#fff;transition:border-color .2s;outline:none}
.search-input:focus{border-color:#a78bfa}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:16px;pointer-events:none}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;color:#94a3b8;cursor:pointer;padding:4px 8px}
.search-clear:hover{color:#64748b}
.search-results{max-height:60vh;overflow-y:auto}
.search-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid #f1f5f9;background:#fff;transition:all .15s}
.search-item:hover{background:#f8fafc;border-color:#e2e8f0}
.search-item-em{font-size:22px;flex-shrink:0;width:36px;text-align:center}
.search-item-main{flex:1;min-width:0}
.search-item-bg{font-size:15px;font-weight:700;color:#1e293b}
.search-item-nl{font-size:13px;color:#64748b}
.search-item-pron{font-size:11px;color:#a78bfa;font-style:italic}
.search-item-mod{font-size:10px;color:#94a3b8;background:#f1f5f9;padding:2px 8px;border-radius:99px;flex-shrink:0}
.search-count{font-size:12px;color:#94a3b8;text-align:center;padding:4px}

/* Galgje */
.hm-word{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.hm-letter{width:32px;height:42px;border-bottom:3px solid #8b5cf6;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#1e293b;transition:all .3s}
.hm-letter-space{width:16px;border-bottom:none}
.hm-letter.revealed{animation:hm-pop .3s}
@keyframes hm-pop{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.hm-keys{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:380px;margin:0 auto}
.hm-key{width:34px;height:38px;border-radius:8px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .15s;border:1px solid #e2e8f0;background:#fff;color:#1e293b}
.hm-key:hover:not(:disabled){background:#f5f3ff;border-color:#a78bfa}
.hm-key:disabled{opacity:.3;cursor:not-allowed}
.hm-key-hit{background:#ecfdf5!important;border-color:#34d399!important;color:#059669!important}
.hm-key-miss{background:#fef2f2!important;border-color:#fca5a5!important;color:#dc2626!important}
.hm-fig{text-align:center;font-size:13px;color:#64748b;margin:8px 0}
.hm-hint-box{background:#fef3c7;border-radius:12px;padding:10px 14px;font-size:13px;color:#92400e;text-align:center}

/* Module progress */
.mod-prog{display:flex;align-items:center;gap:6px;margin-top:4px}
.mod-prog-bar{flex:1;height:4px;background:#f1f5f9;border-radius:99px;overflow:hidden}
.mod-prog-fill{height:100%;border-radius:99px;transition:width .5s}
.mod-prog-txt{font-size:10px;color:#94a3b8;white-space:nowrap}

/* Woordzoeker */
.ws-grid{display:grid;gap:2px;margin:12px auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.ws-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;border-radius:6px;background:#fff;border:1px solid #e2e8f0;cursor:pointer;transition:all .15s;color:#1e293b}
.ws-cell:hover{background:#f5f3ff;border-color:#a78bfa}
.ws-cell.ws-sel{background:#ddd6fe;border-color:#8b5cf6;color:#6d28d9}
.ws-cell.ws-found{background:#d1fae5;border-color:#34d399;color:#065f46}
.ws-cell.ws-hint{background:#fef3c7;border-color:#fbbf24}
.ws-words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ws-word{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid #e2e8f0;background:#fff;color:#1e293b;transition:all .2s}
.ws-word.ws-word-found{background:#d1fae5;border-color:#34d399;color:#065f46;text-decoration:line-through}

/* Zinnen bouwen */
.sb-sentence{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;border-radius:14px;border:2px dashed #e2e8f0;background:#f8fafc;justify-content:center;align-items:center;margin:12px 0}
.sb-sentence.sb-correct{border-color:#34d399;background:#ecfdf5}
.sb-sentence.sb-wrong{border-color:#f87171;background:#fef2f2;animation:sb-shake .4s}
@keyframes sb-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sb-word{padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;border:2px solid #e2e8f0;background:#fff;color:#1e293b}
.sb-word:hover{border-color:#a78bfa;background:#f5f3ff}
.sb-word.sb-placed{opacity:.3;cursor:default;pointer-events:none}
.sb-word.sb-in-slot{background:#ede9fe;border-color:#a78bfa;color:#6d28d9}
.sb-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px}
.sb-trans{text-align:center;font-size:14px;color:#64748b;font-style:italic;padding:8px;background:#f8fafc;border-radius:10px}

/* Dagelijkse Uitdaging */
.dc-card{background:linear-gradient(135deg,#fef3c7,#fffbeb);border:2px solid #fbbf24;border-radius:16px;padding:20px;text-align:center}
.dc-word{font-size:28px;font-weight:800;color:#92400e;margin:8px 0}
.dc-pron{font-size:13px;color:#b45309;font-style:italic}
.dc-nl{font-size:16px;color:#78716c;margin-top:4px}
.dc-dots{display:flex;justify-content:center;gap:8px;margin:12px 0}
.dc-dot{width:12px;height:12px;border-radius:50%;transition:all .3s}
.dc-streak{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}

/* Verhaaltjes */
.story-card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;overflow:hidden}
.story-header{padding:16px;background:linear-gradient(135deg,#f0fdfa,#ecfdf5);border-bottom:1px solid #ccfbf1}
.story-title{font-size:16px;font-weight:700;color:#134e4a}
.story-level{font-size:11px;color:#0d9488;margin-top:2px}
.story-body{padding:16px}
.story-line{padding:8px 0;border-bottom:1px solid #f1f5f9}
.story-line:last-child{border-bottom:none}
.story-bg{font-size:15px;font-weight:600;color:#1e293b;cursor:pointer}
.story-bg:hover{color:#0d9488}
.story-nl{font-size:13px;color:#94a3b8;margin-top:2px;font-style:italic}

/* Cultuur */
.culture-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.culture-card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:14px;text-align:center;cursor:pointer;transition:all .2s}
.culture-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);border-color:#a78bfa}
.culture-em{font-size:32px;margin-bottom:8px}
.culture-t{font-size:13px;font-weight:600;color:#1e293b}
.culture-d{font-size:11px;color:#64748b;margin-top:2px}
.song-line{padding:6px 0;display:flex;gap:8px;border-bottom:1px solid #f1f5f9}
.song-line:last-child{border-bottom:none}
.song-bg{font-size:14px;font-weight:600;color:#1e293b;flex:1}
.song-nl{font-size:12px;color:#64748b;flex:1}

/* Dark Mode */
.dark .app{background:#1e293b}
.dark .nav{background:#0f172a;border-color:#334155}
.dark .nav-title{background:linear-gradient(to right,#2dd4bf,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.dark .card{background:#334155;border-color:#475569}
.dark .card-t,.dark .h1,.dark .h2,.dark .h3{color:#f1f5f9}
.dark .card-d,.dark .sub{color:#94a3b8}
.dark .scr{color:#e2e8f0}
.dark .qo{background:#334155;border-color:#475569;color:#e2e8f0}
.dark .qo:hover:not(:disabled){border-color:#a78bfa;background:#3b0764}
.dark .search-input{background:#334155;border-color:#475569;color:#e2e8f0}
.dark .fact{background:#334155;border-color:#475569}
.dark .tab-row{background:#334155}
.dark .tab{color:#94a3b8}
.dark .tab-on{background:#475569;color:#f1f5f9}
.dark .gram-box{background:#1e3a5f;border-color:#2563eb}
.dark .gram-tbl th{background:#1e3a5f}
.dark .gram-tbl td{border-color:#334155}
.dark .badge-n{background:#334155;border-color:#475569}
.dark .pb{background:#334155}
.dark body{background:#1e293b;color:#e2e8f0}
.dark .mem-face{border-color:#475569;background:#334155}
.dark .mem-front{background:#334155}

/* Flashcards */
.fc-deck{perspective:800px;width:100%;max-width:340px;margin:0 auto}
.fc-card{width:100%;min-height:200px;cursor:pointer;perspective:800px}
.fc-inner{position:relative;width:100%;min-height:200px;transition:transform .6s;transform-style:preserve-3d}
.fc-card.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;width:100%;min-height:200px;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.fc-front{background:linear-gradient(135deg,#0d9488,#059669);color:#fff;border:2px solid #0f766e}
.fc-back{background:#fff;border:2px solid #e2e8f0;transform:rotateY(180deg)}
.fc-rate{display:flex;gap:8px;justify-content:center;margin-top:16px}
.fc-rate button{padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;border:2px solid;transition:all .2s}
.fc-r1{background:#fef2f2;border-color:#fca5a5;color:#dc2626}
.fc-r1:hover{background:#fee2e2}
.fc-r2{background:#fffbeb;border-color:#fcd34d;color:#b45309}
.fc-r2:hover{background:#fef3c7}
.fc-r3{background:#ecfdf5;border-color:#6ee7b7;color:#059669}
.fc-r3:hover{background:#d1fae5}

/* Numbers */
.num-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.num-btn{padding:8px 4px;border-radius:10px;border:2px solid #e2e8f0;background:#fff;text-align:center;cursor:pointer;transition:all .15s}
.num-btn:hover{border-color:#14b8a6;background:#f0fdfa}
.num-btn.num-done{border-color:#6ee7b7;background:#ecfdf5}
.num-big{font-size:18px;font-weight:700;color:#1e293b}
.num-sm{font-size:9px;color:#64748b;margin-top:1px}

/* Crossword */
.cw-grid{display:inline-grid;gap:2px}
.cw-cell{width:32px;height:32px;border:1px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:#fff;text-transform:uppercase}
.cw-cell-black{background:#1e293b;border-color:#1e293b}
.cw-cell-active{border-color:#8b5cf6;background:#ede9fe}
.cw-cell-correct{background:#ecfdf5;border-color:#34d399}
.cw-cell-num{position:relative}
.cw-cell-num::before{position:absolute;top:1px;left:2px;font-size:7px;color:#94a3b8}
.cw-clue{padding:8px 12px;border-radius:10px;background:#f5f3ff;border:1px solid #ddd6fe;font-size:13px;margin-top:4px}

/* Interactive Conversation */
.ic-scene{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border-radius:16px;padding:16px;border:1px solid #a7f3d0;min-height:100px;margin-bottom:12px}
.ic-bubble{padding:10px 14px;border-radius:14px;margin-bottom:8px;max-width:85%;font-size:14px}
.ic-bubble-oma{background:#fff;border:1px solid #e2e8f0;border-bottom-left-radius:4px;margin-right:auto}
.ic-bubble-kid{background:#0d9488;color:#fff;border-bottom-right-radius:4px;margin-left:auto}
.ic-choices{display:flex;flex-direction:column;gap:8px}
.ic-choice{padding:12px 16px;border-radius:12px;border:2px solid #e2e8f0;background:#fff;text-align:left;font-size:14px;transition:all .15s;cursor:pointer}
.ic-choice:hover{border-color:#14b8a6;background:#f0fdfa}
.ic-choice-ok{background:#ecfdf5;border-color:#34d399}
.ic-choice-no{background:#fef2f2;border-color:#f87171}

/* Letter Trace */
.lt-canvas-wrap{position:relative;display:inline-block;border-radius:16px;overflow:hidden;border:2px solid #e2e8f0}
.lt-canvas{touch-action:none;display:block}
.lt-guide{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:120px;font-weight:800;color:rgba(0,0,0,.06);pointer-events:none}

/* Write to Oma */
.oma-area{width:100%;min-height:100px;padding:12px;border-radius:12px;border:2px solid #e2e8f0;font-size:16px;font-family:inherit;resize:vertical;transition:border-color .2s}
.oma-area:focus{border-color:#14b8a6;outline:none}
.oma-kb{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.oma-key{padding:6px 2px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.oma-key:hover{background:#f0fdfa;border-color:#14b8a6}

/* Parent Dashboard */
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pd-card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:14px;text-align:center}
.pd-val{font-size:24px;font-weight:800;color:#0d9488}
.pd-lbl{font-size:11px;color:#64748b;margin-top:2px}
.pd-bar-wrap{height:16px;background:#f1f5f9;border-radius:8px;overflow:hidden;margin-top:4px}
.pd-bar{height:100%;border-radius:8px;transition:width .5s}

/* Sound flash */
@keyframes flashGreen{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}100%{box-shadow:0 0 0 20px rgba(16,185,129,0)}}
@keyframes flashRed{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}100%{box-shadow:0 0 0 20px rgba(239,68,68,0)}}
.flash-ok{animation:flashGreen .4s ease-out}
.flash-no{animation:flashRed .4s ease-out}
</style>
</head>

// === QUIZ ===
function Quiz({go,st,sS}){

      for(var i2=0;i2<Math.min(cnt2,sw.length);i2++){
        var c2=sw[i2];var wr2=sh(aw.filter(function(w){return w.b!==c2.b;})).slice(0,3);

          ce("div",{className:"card-r"},
            ce("div",{style:{fontSize:28,marginRight:12}},"\u{1f1e7}\u{1f1ec}"),
            ce("div",{className:"card-b"},ce("div",{className:"card-t"},"Bulgaars \u2192 Nederlands"),ce("div",{className:"card-d"},"Vertaal het Bulgaarse woord")))),
        ce("button",{className:"card",onClick:function(){sQMode("nl-bg");gen("nl-bg");},style:{width:"100%",textAlign:"left",padding:16}},
          ce("div",{className:"card-r"},
            ce("div",{style:{fontSize:28,marginRight:12}},"\u{1f1f3}\u{1f1f1}"),
            ce("div",{className:"card-b"},ce("div",{className:"card-t"},"Nederlands \u2192 Bulgaars"),ce("div",{className:"card-d"},"Kies het juiste Bulgaarse woord")))),

        ce("button",{className:"btn btn-g",onClick:function(){go("home");},style:{background:"#f1f5f9"}},"Home")));}

  return ce("div",{className:"scr sy"},
    ce("div",{className:"nr"},

      return ce("button",{key:i,className:cl,disabled:sh2,onClick:function(){pick(o);}},

// === GALGJE ===
function Hangman({go,st,sS}){
  var aw=allWords(MODS);
  var[word,sWord]=uS(null);
  var[guessed,sGuessed]=uS([]);
  var[wrong,sWrong]=uS(0);
  var[done,sDone]=uS(false);
  var[won,sWon]=uS(false);
  var[showHint,sShowHint]=uS(false);
  var[diff,sDiff]=uS(null);
  var maxWrong=6;

  // Cyrillic alphabet for keyboard
  var cyrillic="\u0410\u0411\u0412\u0413\u0414\u0415\u0416\u0417\u0418\u0419\u041a\u041b\u041c\u041d\u041e\u041f\u0420\u0421\u0422\u0423\u0424\u0425\u0426\u0427\u0428\u0429\u042a\u042c\u042e\u042f".split("");

  var startGame=function(d){
    sDiff(d);
    var pool=d==="easy"?aw.filter(function(w){return w.b.length<=5;}):
              d==="hard"?aw.filter(function(w){return w.b.length>=8;}):aw;
    if(pool.length<5)pool=aw;
    var w=pool[Math.floor(Math.random()*pool.length)];
    sWord(w);sGuessed([]);sWrong(0);sDone(false);sWon(false);sShowHint(false);
  };

  var guess=function(letter){
    if(done||guessed.indexOf(letter)>=0)return;
    var ng=guessed.concat([letter]);
    sGuessed(ng);
    var upper=word.b.toUpperCase();
    if(upper.indexOf(letter)<0){
      var nw=wrong+1;
      sWrong(nw);
      if(nw>=maxWrong){sDone(true);sWon(false);}
    } else {
      // Check if won
      var letters=upper.split("").filter(function(c){return c!==" ";});
      var allGuessed=letters.every(function(c){return ng.indexOf(c)>=0;});
      if(allGuessed){
        sDone(true);sWon(true);
        sS(function(s){return Object.assign({},s,{xp:s.xp+20,hw:(s.hw||0)+1});});
      }
    }
  };

  // Hangman figure (text-based)
  var hParts=[
    {e:"\u{1f6b6}",t:""},
    {e:"\u{1f9b6}",t:"Voet..."},
    {e:"\u{1f9b5}",t:"Been..."},
    {e:"\u{1f9b6}\u{1f9b5}",t:"Lichaam..."},
    {e:"\u{1f44b}",t:"Armen..."},
    {e:"\u{1f62c}",t:"Bijna..."},
    {e:"\u{1f480}",t:"Game over!"}
  ];

  // Difficulty selection
  if(!diff){
    return ce("div",{className:"scr sy"},
      ce("div",{className:"ctr"},
        ce("div",{style:{fontSize:48}},"\u{1f620}"),
        ce("h2",{className:"h1"},"Galgje"),
        ce("p",{className:"sub"},"Raad het Bulgaarse woord!")),
      ce("div",{className:"sy3"},
        ce("button",{className:"card",onClick:function(){startGame("easy");},style:{width:"100%",textAlign:"left",padding:16}},
          ce("div",{className:"card-r"},
            ce("div",{style:{fontSize:28,marginRight:12}},"\u{1f331}"),
            ce("div",{className:"card-b"},ce("div",{className:"card-t"},"Makkelijk"),ce("div",{className:"card-d"},"Korte woorden (max 5 letters)")))),
        ce("button",{className:"card",onClick:function(){startGame("medium");},style:{width:"100%",textAlign:"left",padding:16}},
          ce("div",{className:"card-r"},
            ce("div",{style:{fontSize:28,marginRight:12}},"\u{1f33f}"),
            ce("div",{className:"card-b"},ce("div",{className:"card-t"},"Gemiddeld"),ce("div",{className:"card-d"},"Alle woorden")))),
        ce("button",{className:"card",onClick:function(){startGame("hard");},style:{width:"100%",textAlign:"left",padding:16}},
          ce("div",{className:"card-r"},
            ce("div",{style:{fontSize:28,marginRight:12}},"\u{1f525}"),
            ce("div",{className:"card-b"},ce("div",{className:"card-t"},"Moeilijk"),ce("div",{className:"card-d"},"Lange woorden (8+ letters)"))))
      ),
      ce("button",{className:"btn btn-g",style:{marginTop:12},onClick:function(){go("home");}},"\u2190 Home"));
  }

  if(!word)return null;

  // Done screen
  if(done){
    return ce("div",{className:"scr sy ctr"},
      ce("div",{style:{fontSize:56}},won?"\u{1f389}":"\u{1f614}"),
      ce("h2",{className:"h1"},won?"Gewonnen!":"Helaas!"),
      ce("div",{style:{fontSize:28,fontWeight:700,color:"#6d28d9",margin:"8px 0"}},word.b),
      ce("div",{style:{fontSize:16,color:"#64748b"}},word.n),
      word.p&&ce("div",{style:{fontSize:13,color:"#a78bfa",fontStyle:"italic"}},"["+word.p+"]"),
      won&&ce("p",{style:{color:"#64748b",marginTop:8,fontSize:13}},"+20 XP verdiend!"),
      ce("div",{style:{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap",marginTop:16}},
        ce("button",{className:"btn btn-v",onClick:function(){startGame(diff);}},"\u{1f504} Opnieuw"),
        ce("button",{className:"btn btn-g",onClick:function(){sDiff(null);}},"\u{1f3af} Ander niveau"),
        ce("button",{className:"btn btn-g",onClick:function(){go("home");},style:{background:"#f1f5f9"}},"Home")));
  }

  // Game board
  var upper=word.b.toUpperCase();
  return ce("div",{className:"scr sy"},
    ce("div",{className:"nr"},
      ce("button",{className:"btn btn-g",onClick:function(){sDiff(null);}},"\u2190 Terug"),
      ce("div",{style:{display:"flex",alignItems:"center",gap:12}},
        ce("span",{style:{fontSize:13,color:"#64748b"}},"Fout: "+wrong+"/"+maxWrong),
        !showHint&&!done&&ce("button",{className:"btn",style:{fontSize:12,background:"#fef3c7",color:"#92400e",padding:"4px 10px"},onClick:function(){sShowHint(true);}},"\u{1f4a1} Hint"))),
    // Hangman figure
    ce("div",{style:{textAlign:"center",margin:"8px 0"}},
      ce("div",{style:{fontSize:48}},wrong===0?"\u{1f60a}":wrong<3?"\u{1f610}":wrong<5?"\u{1f627}":wrong<6?"\u{1f630}":"\u{1f480}"),
      ce("div",{style:{display:"flex",justifyContent:"center",gap:4,marginTop:4}},
        Array(maxWrong).fill(0).map(function(_,i){
          return ce("div",{key:i,style:{width:16,height:16,borderRadius:"50%",background:i<wrong?"#f87171":"#e2e8f0",transition:"all .3s"}});
        })),
      wrong>0&&ce("div",{style:{fontSize:12,color:"#dc2626",marginTop:4}},wrong+" van "+maxWrong+" fout")),
    // Hint
    showHint&&ce("div",{className:"hm-hint-box"},"\u{1f4a1} Nederlands: "+word.n),
    // Word display
    ce("div",{className:"hm-word"},
      upper.split("").map(function(c,i){
        if(c===" ")return ce("div",{key:i,className:"hm-letter hm-letter-space"});
        var revealed=guessed.indexOf(c)>=0;
        return ce("div",{key:i,className:"hm-letter"+(revealed?" revealed":"")},revealed?word.b[i]:"");
      })),
    // Emoji & category
    ce("div",{className:"ctr"},ce("span",{style:{fontSize:24}},word.m||"")),
    // Keyboard
    ce("div",{className:"hm-keys"},
      cyrillic.map(function(l){
        var used=guessed.indexOf(l)>=0;
        var hit=used&&upper.indexOf(l)>=0;
        var miss=used&&upper.indexOf(l)<0;
        return ce("button",{key:l,className:"hm-key"+(hit?" hm-key-hit":"")+(miss?" hm-key-miss":""),disabled:used,onClick:function(){guess(l);}},l);
      })));
}

  // Find module info for each word

      ce("button",{className:"btn btn-g",onClick:function(){go("home");}},"\u2190 Home")),
    ce("div",{className:"ctr"},
      ce("div",{style:{fontSize:36}},"\u{1f50d}"),
      ce("h2",{className:"h1"},"Woordenboek"),
      ce("p",{className:"sub"},aw.length+" woorden")),
    ce("div",{className:"search-box"},
      ce("span",{className:"search-icon"},"\u{1f50e}"),
      ce("input",{className:"search-input",placeholder:"Zoek in Bulgaars, Nederlands of Engels...",value:q,onChange:function(e){sQ(e.target.value);}}),
      q.length>0&&ce("button",{className:"search-clear",onClick:function(){sQ("");}},"\u2715")),
    ce("div",{className:"search-count"},filtered.length===aw.length?
      "Typ om te zoeken":
